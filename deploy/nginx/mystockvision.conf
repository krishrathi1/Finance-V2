server {
    listen 80;
    server_name mystockvision.com www.mystockvision.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://mystockvision.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.mystockvision.com;

    # SSL configuration (Certbot will fill this in or is already active)
    # ssl_certificate /etc/letsencrypt/live/mystockvision.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mystockvision.com/privkey.pem;

    # Redirect www to non-www to maintain consistent origin (fixes CORS)
    return 301 https://mystockvision.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mystockvision.com;

    # SSL configuration (Certbot will fill this in)
    # ssl_certificate /etc/letsencrypt/live/mystockvision.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mystockvision.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
