server {
    listen 80;
    server_name mystockvision.com www.mystockvision.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://mystockvision.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.mystockvision.com;

    # Let's Encrypt's live/ symlink is stable across renewals (Certbot
    # updates the target files in place, not this path), so hardcoding it
    # here is safe and — unlike leaving it commented out — doesn't break
    # every subsequent `deploy.sh` run, which recopies this file over the
    # live nginx config before `nginx -t`. First-time bootstrap order:
    # deploy with these two lines commented out (HTTP-only works), run
    # `certbot --nginx -d mystockvision.com -d www.mystockvision.com` once
    # to obtain the certs, then uncomment and redeploy.
    ssl_certificate /etc/letsencrypt/live/mystockvision.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mystockvision.com/privkey.pem;

    # Redirect www to non-www to maintain consistent origin (fixes CORS)
    return 301 https://mystockvision.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mystockvision.com;

    # SSL configuration (Certbot will fill this in)
    # ssl_certificate /etc/letsencrypt/live/mystockvision.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mystockvision.com/privkey.pem;

    # Everything — pages and /api — is served by the Next.js app.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
