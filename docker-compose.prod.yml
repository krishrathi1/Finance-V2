services:
  postgres:
    image: postgres:16
    container_name: ffa-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: financial_forensics
      POSTGRES_USER: ffa
      POSTGRES_PASSWORD: ffa_prod_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ffa-redis-prod
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: ffa-backend-prod
    restart: always
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://ffa:ffa_prod_password_change_me@postgres:5432/financial_forensics
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/ai-engine/src
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    container_name: ffa-frontend-prod
    restart: always
    env_file:
      - ./frontend/.env.prod
    environment:
      NEXT_PUBLIC_API_BASE: https://mystockvision.com
      INTERNAL_API_BASE: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
