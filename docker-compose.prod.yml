services:
  postgres:
    image: postgres:16
    container_name: ffa-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: financial_forensics
      POSTGRES_USER: ffa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a root .env file}
    # No host port publishing — backend reaches this over the internal
    # compose network as "postgres:5432". Use `docker compose exec` or an
    # SSH tunnel for ad-hoc admin access instead of exposing 5432 publicly.
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ffa-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in a root .env file}
    # No host port publishing — see postgres note above.

  backend:
    build:
      context: ./backend
    container_name: ffa-backend-prod
    restart: always
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://ffa:${POSTGRES_PASSWORD}@postgres:5432/financial_forensics
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app:/ai-engine/src
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE=http://mystockvision.com
    container_name: ffa-frontend-prod
    restart: always
    env_file:
      - ./frontend/.env.prod
    environment:
      NEXT_PUBLIC_API_BASE: http://mystockvision.com
      INTERNAL_API_BASE: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
