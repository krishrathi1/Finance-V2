services:
  mysql:
    image: mysql:8
    container_name: ffa-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: financial_forensics
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in a root .env file}
    # No host port publishing — the frontend reaches this over the internal
    # compose network as "mysql:3306". Use `docker compose exec mysql mysql`
    # or an SSH tunnel for ad-hoc admin access.
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE=https://mystockvision.com
    container_name: ffa-frontend-prod
    restart: always
    env_file:
      - ./frontend/.env.prod
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: financial_forensics
      NEXT_PUBLIC_API_BASE: https://mystockvision.com
      INTERNAL_API_BASE: http://127.0.0.1:3000
    depends_on:
      mysql:
        condition: service_healthy
    # Bound to loopback only — nginx is the sole public entry point (see
    # deploy/nginx/mystockvision.conf). Publishing on all interfaces here
    # would let callers reach the app directly over plaintext HTTP,
    # bypassing TLS termination and the IP-based rate limiting that assumes
    # requests arrive via nginx's X-Real-IP.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data_prod:
