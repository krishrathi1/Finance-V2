# Render Blueprint Configuration
# This file automates deployment for your Postgres DB, Redis Cache, FastAPI Backend, and Next.js Frontend.
# Documentation: https://render.com/docs/blueprints

databases:
  - name: financial_forensics_db
    databaseName: financial_forensics
    user: ffa
    plan: free

services:
  # 1. KeyValue Storage (Valkey/Redis-compatible)
  - type: keyvalue
    name: redis-cache
    plan: free
    ipAllowList: [] # Private network only

  # 2. Backend Web Service (FastAPI)
  - type: web
    name: backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r ../ai-engine/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial_forensics_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-cache
          property: connectionString
      # Application Configuration
      - key: APP_NAME
        value: "Financial Forensics AI API"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend:/opt/render/project/src/ai-engine/src"
      # Load secret group
      - fromGroup: finance-ai-secrets

  # 3. Frontend Web Service (Next.js)
  - type: web
    name: frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: backend
          property: url
      - key: INTERNAL_API_BASE
        fromService:
          type: web
          name: backend
          property: url
      - key: NODE_ENV
        value: "production"

envGroups:
  - name: finance-ai-secrets
    envVars:
      # API Keys (You will be prompted to enter values in Render dashboard)
      - key: FMP_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROWW_API_KEY
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
