services:
  - type: web
    name: financial-forensics-backend
    runtime: python
    plan: starter
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt && pip install -r ai-engine/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: financial-forensics-cache
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://myfinance.live,https://www.myfinance.live
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.(vercel\.app|onrender\.com)$
      - key: FMP_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview

  - type: web
    name: financial-forensics-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      - key: INTERNAL_API_BASE
        sync: false

  - type: keyvalue
    name: financial-forensics-cache
    plan: starter
    ipAllowList: []
