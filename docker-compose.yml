services:
  mysql:
    image: mysql:8
    container_name: ffa-mysql
    environment:
      MYSQL_DATABASE: financial_forensics
      MYSQL_ROOT_PASSWORD: ffa_dev
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pffa_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: ffa-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ffa_dev
      MYSQL_DATABASE: financial_forensics
      NEXT_PUBLIC_API_BASE: http://dev.mystockvision.com
      INTERNAL_API_BASE: http://dev.mystockvision.com
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/scripts/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3003:3000"
    command: sh -c "node scripts/init-db.js && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  mysql_data:
